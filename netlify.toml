[build]
  # Angular site only - the API runs on Render
  command   = "npm run build"
  publish   = "dist/maroti-maharaj-temple"

[build.environment]
  NODE_VERSION = "16"

# API → Render backend (Express app in backend/)
[[redirects]]
  from   = "/api/*"
  to     = "https://maroti-maraj-temple-2.onrender.com/api/:splat"
  status = 200
  force  = true

# Angular routing: every other URL loads the app
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
